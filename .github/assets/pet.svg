<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" fill="none" role="img" aria-label="Bit, the attendance mascot">
  <defs>
    <style>
      @keyframes bob    { 0%,100% { transform: translateY(0) }    50% { transform: translateY(-12px) } }
      @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: 0.5 } 50% { transform: scaleX(0.8); opacity: 0.3 } }
      @keyframes blink  { 0%,92%,100% { transform: scaleY(1) } 96% { transform: scaleY(0.1) } }
      @keyframes wave   { 0%,100% { transform: rotate(0deg) } 50% { transform: rotate(18deg) } }
      .body   { animation: bob 3s ease-in-out infinite; transform-origin: center; }
      .shade  { animation: shadow 3s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .eyes   { animation: blink 4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      .hand   { animation: wave 2.4s ease-in-out infinite; transform-origin: 155px 118px; transform-box: view-box; }
    </style>
  </defs>

  <ellipse class="shade" cx="110" cy="180" rx="46" ry="8" fill="#000000"/>

  <g class="body">
    <!-- little waving hand -->
    <g class="hand">
      <rect x="150" y="112" width="13" height="26" rx="6.5" fill="#f2f2f2"/>
    </g>
    <!-- body blob -->
    <rect x="58" y="70" width="104" height="98" rx="34" fill="#f2f2f2"/>
    <rect x="58" y="70" width="104" height="98" rx="34" fill="#000000" fill-opacity="0.04"/>
    <!-- little antenna (a cursor caret nod) -->
    <rect x="106" y="52" width="8" height="20" rx="4" fill="#f2f2f2"/>
    <circle cx="110" cy="50" r="6" fill="#3d7dff"/>
    <!-- eyes -->
    <g class="eyes">
      <circle cx="90"  cy="108" r="8" fill="#0a0a0a"/>
      <circle cx="130" cy="108" r="8" fill="#0a0a0a"/>
      <circle cx="92"  cy="105" r="2.5" fill="#ffffff"/>
      <circle cx="132" cy="105" r="2.5" fill="#ffffff"/>
    </g>
    <!-- smile -->
    <path d="M96 132 Q110 144 124 132" stroke="#0a0a0a" stroke-width="4" stroke-linecap="round" fill="none"/>
    <!-- cheeks -->
    <circle cx="76"  cy="126" r="5" fill="#3d7dff" fill-opacity="0.35"/>
    <circle cx="144" cy="126" r="5" fill="#3d7dff" fill-opacity="0.35"/>
  </g>
</svg>
