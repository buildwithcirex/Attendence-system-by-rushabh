<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" fill="none" role="img" aria-label="E-Cell Attendance">
  <defs>
    <radialGradient id="glow" cx="50%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <style>
      @keyframes pulse { 0%,100% { opacity: 0.55 } 50% { opacity: 1 } }
      @keyframes blink { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes slide { 0% { transform: translateX(-260px) } 100% { transform: translateX(260px) } }
      .glow  { animation: pulse 4s ease-in-out infinite; }
      .caret { animation: blink 1.1s step-end infinite; }
      .sweep { animation: slide 3.5s ease-in-out infinite; }
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="0" fill="#0a0a0a"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect width="1200" height="300" fill="url(#glow)" class="glow"/>

  <text x="600" y="150" text-anchor="middle" font-size="72" font-weight="800" letter-spacing="-3" fill="#f2f2f2">E&#8209;Cell Attendance</text>

  <g transform="translate(600 200)">
    <text x="0" y="0" text-anchor="middle" font-size="20" class="mono" fill="#9b9b9b" letter-spacing="1">tracking presence, one OTP at a time<tspan class="caret" fill="#f2f2f2">&#9614;</tspan></text>
  </g>

  <g transform="translate(0 240)">
    <rect x="470" y="0" width="260" height="2" rx="1" fill="#ffffff" fill-opacity="0.08"/>
    <g style="overflow:hidden">
      <rect x="470" y="0" width="140" height="2" rx="1" fill="url(#sweep)" class="sweep"/>
    </g>
  </g>
</svg>
