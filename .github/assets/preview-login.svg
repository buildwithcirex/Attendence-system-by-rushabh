<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" width="760" height="520" fill="none" role="img" aria-label="Login screen preview">
  <defs>
    <radialGradient id="lglow" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes caret { 0%,49% { opacity: 1 } 50%,100% { opacity: 0 } }
      @keyframes fill  { 0% { opacity: 0.4 } 50% { opacity: 1 } 100% { opacity: 0.4 } }
      .caret { animation: caret 1.1s step-end infinite; }
      .live  { animation: fill 2.2s ease-in-out infinite; }
      text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="760" height="520" fill="#0a0a0a"/>
  <rect width="760" height="520" fill="url(#lglow)"/>

  <!-- card -->
  <g transform="translate(230 60)">
    <rect width="300" height="400" rx="20" fill="#141414" stroke="#ffffff" stroke-opacity="0.08"/>

    <!-- icon tile -->
    <rect x="126" y="30" width="48" height="48" rx="14" fill="#1c1c1c" stroke="#ffffff" stroke-opacity="0.14"/>
    <circle cx="150" cy="50" r="9" fill="none" stroke="#f2f2f2" stroke-width="3"/>
    <path d="M150 59 v10" stroke="#f2f2f2" stroke-width="3" stroke-linecap="round"/>

    <text x="150" y="108" text-anchor="middle" font-size="20" font-weight="700" fill="#f2f2f2">E-Cell Portal</text>
    <text x="150" y="130" text-anchor="middle" font-size="11" fill="#9b9b9b">Secure authentication via OTP</text>

    <!-- email field -->
    <text x="30" y="164" font-size="11" fill="#9b9b9b">Email Address</text>
    <rect x="30" y="174" width="240" height="38" rx="10" fill="#1c1c1c" stroke="#3d7dff" stroke-opacity="0.7"/>
    <text x="42" y="198" font-size="12" class="mono" fill="#f2f2f2">you@kccemsr.edu.in<tspan class="caret" fill="#3d7dff">|</tspan></text>

    <!-- OTP boxes -->
    <text x="30" y="240" font-size="11" fill="#9b9b9b">One-Time Password</text>
    <g transform="translate(30 250)">
      <rect x="0"   width="34" height="42" rx="10" fill="#1c1c1c" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="42"  width="34" height="42" rx="10" fill="#1c1c1c" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="84"  width="34" height="42" rx="10" fill="#1c1c1c" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="126" width="34" height="42" rx="10" fill="#1c1c1c" stroke="#ffffff" stroke-opacity="0.08"/>
      <rect x="168" width="34" height="42" rx="10" fill="#1c1c1c" stroke="#3d7dff" stroke-opacity="0.7"/>
      <rect x="210" width="34" height="42" rx="10" fill="#1c1c1c" stroke="#ffffff" stroke-opacity="0.08"/>
      <text x="17"  y="28" text-anchor="middle" font-size="16" class="mono" fill="#f2f2f2">4</text>
      <text x="59"  y="28" text-anchor="middle" font-size="16" class="mono" fill="#f2f2f2">2</text>
      <text x="101" y="28" text-anchor="middle" font-size="16" class="mono" fill="#f2f2f2">9</text>
      <text x="143" y="28" text-anchor="middle" font-size="16" class="mono" fill="#f2f2f2">1</text>
      <text x="185" y="28" text-anchor="middle" font-size="16" class="mono caret" fill="#f2f2f2">7</text>
    </g>

    <!-- primary button -->
    <rect x="30" y="312" width="240" height="40" rx="11" fill="#f2f2f2"/>
    <text x="150" y="337" text-anchor="middle" font-size="13" font-weight="600" fill="#0a0a0a">Access Portal</text>

    <!-- admin magic-link button -->
    <rect x="30" y="360" width="240" height="30" rx="9" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle class="live" cx="118" cy="375" r="4" fill="#3d7dff"/>
    <text x="150" y="379" text-anchor="middle" font-size="11" fill="#f2f2f2">Email me an admin login link</text>
  </g>
</svg>
